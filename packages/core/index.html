<!doctype html>
<html lang="en" data-corners="%GUIDE_CORNERS%">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="%GUIDE_THEME_COLOR%" data-dark="%GUIDE_THEME_COLOR_DARK%">
  <meta name="description" content="%GUIDE_DESCRIPTION%">
  <meta name="guide-storage" content="%GUIDE_STORAGE%">
  <link rel="icon" href="/favicon.ico" sizes="32x32">
  <link rel="icon" href="/icons/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="%GUIDE_SHORT_NAME%">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="%GUIDE_NAME%">
  <meta property="og:url" content="%GUIDE_HOME%/">
  <meta property="og:title" content="%GUIDE_TITLE%">
  <meta property="og:description" content="%GUIDE_DESCRIPTION%">
  <meta property="og:image" content="%GUIDE_OG_IMAGE%">
  <meta property="og:image:width" content="%GUIDE_OG_WIDTH%">
  <meta property="og:image:height" content="%GUIDE_OG_HEIGHT%">
  <meta property="og:image:alt" content="%GUIDE_OG_ALT%">
  <meta name="twitter:card" content="summary_large_image">
  <script type="application/ld+json">%GUIDE_JSONLD%</script>
  <title>%GUIDE_TITLE%</title>
  %GUIDE_FONT_PRELOADS%
  <style>%GUIDE_FONTS%</style>
  <noscript><style>#root>main{position:static;width:auto;height:auto;margin:0;padding:1rem;overflow:visible;clip:auto;clip-path:none;white-space:normal}#root a{text-decoration:underline}</style></noscript>
  <script src="/theme-init.js" vite-ignore></script>
</head>
<body>
  <div id="root">%GUIDE_MAIN%</div>
  <noscript>
    <p class="p-4">Enable JavaScript to open the guide and save checklist progress.</p>
  </noscript>
  <script type="module" src="/@core/main.tsx"></script>
</body>
</html>
